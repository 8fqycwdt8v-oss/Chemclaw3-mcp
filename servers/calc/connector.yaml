# The `calc` server's declared tool surface.
#
# ############################################################################################
# # THIS MANIFEST DOES NOT GO ON `CHEMCLAW_CONNECTORS_DIR`.                                  #
# ############################################################################################
#
# `chem` and `safety` are connectors Chemclaw3 dials (D-2026-08-09-a-connector-we-do-not-run):
# drop their directory on the path and the capability appears with no core edit. **This one is
# not.** Chemclaw3 keeps its own `calc` bundle and every tool in it; what moved here is
# the *physics* behind them — its calculators and its durable jobs' activities alike — and
# Chemclaw3 calls this server from inside
# `science/calc/store.py::cached_compute` as a backend on a cache miss.
#
# The name is nonetheless `calc`, because this repository requires the directory, the package
# suffix, the manifest `name` and the addressing key to be one string
# (`tests/test_fleet.py::test_the_name_is_one_string_used_four_times`). So registering this
# directory as a connector would let a *partial* port win a name collision — first directory wins,
# with no error either way — and silently remove everything the in-tree bundle serves that is not
# listed below:
#
#   report_measurement · find_calculations · list_artifacts · fetch_artifact ·
#   calculator_trust · calculator_outliers   … and every `jobs:` entry (solvent screens,
#   conformer ensembles, reaction energetics, relaxed scans, host-guest complexes).
#
# Those are the calculation cache, the artifact store, the calibration ledger and the Temporal
# queues — state, which a server in this fleet is by construction not.
#
# **`mount: backend` below is what makes that mechanical rather than trusted.** This directory is
# registered in `manifests-internal/`, which no published `export CHEMCLAW_CONNECTORS_DIR=...` line
# names, and the key is the second layer under that: Chemclaw3's `ConnectorManifest` is
# `extra="forbid"`, so a deployment that points a path here anyway gets a `ConnectorError` naming
# this file at startup instead of a partial surface winning the name. It is read by
# `tests/test_fleet.py` on this side and by nothing on Chemclaw3's, which is the point — a manifest
# Chemclaw3 must refuse is one it cannot silently accept.
#
# **What this file is for**, then: it is this repository's own declaration of the served surface,
# every tool classified exactly once, checked against the running server by `tests/test_server.py`.
# It is what a reviewer reads and what a deployment's tooling can validate. `docs/integration.md`
# has the wiring.
#
# The URL below is the loopback dev default; a deployment supplies the address.
mount: backend
name: calc
description: >-
  Fast local calculators, request/response and stateless: GFN2-xTB single-point energies, electronic
  properties, condensed Fukui site reactivity, geometry optimization, and the second derivatives and
  IR intensities a vibrational analysis is built from; plus the xTB pKa predictor, an ESOL
  aqueous-solubility baseline, pH-dependent logD and an RDKit developability panel. **The RRHO
  thermochemistry and the IR spectrum themselves are not here** — the normal-mode projection and the
  partition functions over them are pure arithmetic and stayed in Chemclaw3 with the tools that
  report them, which is the same primitive/composite split that keeps `compute_thermochemistry` off
  this server. `compute_hessian` returns matrices, not a spectrum. Every result carries the
  `calc_version` that produced it — and, where
  the calculation is keyable, the full `calc_type@calc_version:input_hash:params_hash` string — because
  those are assembled from the tblite/RDKit builds and any xtb binary installed *here* and cannot be
  re-derived by a caller. No calculation cache, no artifact store, no calibration ledger, no durable
  jobs, and no network call at any point.

endpoint:
  transport: http
  # A loopback dev default; the deployment moves it.
  url: http://127.0.0.1:8860/mcp
  health_url: http://127.0.0.1:8860/healthz
  # **Wider than every other manifest in this fleet, and not by habit.** Chemclaw3's own `calc`
  # bundle allowed 30 s, which suited a connector whose repeats were served from a Postgres cache.
  # Nothing is cached here, so a cold `compute_thermochemistry` on a drug-sized molecule pays the
  # full 6N single points every time — minutes, not milliseconds. 900 s is the bound that stops a
  # mute connector hanging a turn; the tool's own docstring is what stops a model asking for one
  # casually, and `CHEMCLAW_XTB_HESSIAN_MAX_ATOMS` is what refuses the ones that would blow past it.
  request_timeout: 900
  # Bearer even though the shipped URL is loopback. `HttpEndpoint` would accept `mode: none` here and
  # refuse it the moment a deployment points this at a real host — and a manifest whose auth mode
  # changes with its address is one whose serving side gets it wrong. The token env var is the same
  # name on both sides: Chemclaw3 reads it to send, `app.py` reads it to verify.
  auth:
    mode: bearer
    token_env: CHEMCLAW_CALC_TOKEN
  tools:
    # The ten backing Chemclaw3's own SMILES-in tools, one for one. Its bundle is what an agent
    # sees; these are what its tool bodies call.
    - compute_xtb_energy
    - compute_electronic_properties
    - predict_site_reactivity
    - compute_atomic_descriptors
    - compute_surface_potential
    - optimize_geometry
    - predict_pka
    - predict_solubility
    - predict_logd
    - predict_developability_profile
    # The seven primitives Chemclaw3's durable-job activities compose: a structure in, a structure or
    # a matrix out. Individually keyed, which is the point — Chemclaw3 caches one row per primitive
    # instead of one per job, so a solvent screen that gains a seventh solvent reuses the other six
    # and a scan that gains two points reuses the twenty-four it had.
    - relax_structure
    - compute_properties_at
    - compute_fukui_at
    - compute_hessian
    - scan_point
    - search_conformer_ensemble
    - search_binding_modes
    # Three helpers that compute nothing: two build the geometries the primitives consume, and one
    # answers what a calculation *would* be stored under, so the caller can look it up first.
    - embed_structure
    - combine_structures
    - calculation_key
  # **The three that compute nothing are `read_only`, and the classification argument is the whole
  # design in miniature.** `read_only` is not a claim about side effects — nothing on this server
  # writes anything — it is a gate: the plan gate lets an *unapproved* plan call a `read_only` tool.
  # These three cost a canonicalisation, an embedding and a few hashes between them, run no SCF, and
  # are exactly what a chemist wants answerable *before* deciding whether to approve the work: what
  # molecule is this, and has it already been computed?
  read_only:
    - embed_structure
    - combine_structures
    - calculation_key
  # **Everything that runs an SCF stays `state_changing`**, matching Chemclaw3's own manifest for
  # the tools it shares with it.
  #
  # It reads oddly for a stateless server and is still right, by the same gate argument in the other
  # direction: these are seconds to hours of CPU each with no cache underneath them here, and the
  # reason to make a chemist approve the plan before they run has if anything got stronger since the
  # cache moved to the caller. The two CREST searches are the extreme case — Chemclaw3's own
  # manifest additionally marks their durable-job equivalents `expensive: true`, feeding
  # `authz.expensive_actions`, and **that gate stays on the Chemclaw3 side**: it is an authorization
  # decision about a person, which a tool server has no basis to make and this one deliberately does
  # not try to reproduce.
  state_changing:
    - compute_xtb_energy
    - compute_electronic_properties
    - predict_site_reactivity
    - compute_atomic_descriptors
    - compute_surface_potential
    - optimize_geometry
    - predict_pka
    - predict_solubility
    - predict_logd
    - predict_developability_profile
    - relax_structure
    - compute_properties_at
    - compute_fukui_at
    - compute_hessian
    - scan_point
    - search_conformer_ensemble
    - search_binding_modes
