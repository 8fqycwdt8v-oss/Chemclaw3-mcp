[project]
name = "chemclaw-mcp-calc"
version = "0.1.0"
description = "MCP server: GFN2-xTB energies, properties, geometries and thermochemistry, plus pKa, solubility, logD and developability descriptors."
requires-python = ">=3.11"
# The heaviest dependency closure in this fleet, and every entry is load-bearing:
#
# - `tblite` is the GFN semiempirical Hamiltonian, in-process. It ships manylinux wheels and needs no
#   Fortran toolchain at install time, which is what makes this server buildable at all — and its
#   *distribution version* is part of every `calc_version` this server emits.
# - `rdkit` parses, canonicalizes, embeds the 3D geometry and computes the Crippen/QED descriptors.
#   Its version is in `calc_version` too, for the good reason that a new RDKit shifts the
#   seeded ETKDG embedding and therefore every energy computed on it.
# - `scipy` is the null-space projection that separates a molecule's vibrations from its
#   translations and rotations, **and the CODATA table every unit conversion in `xtb_engine.py` is
#   derived from** — which is why its distribution version is part of `engine_version()`.
# - `geometric` (geomeTRIC) is the geometry optimizer: delocalised internal coordinates over
#   tblite's analytic gradient, replacing ~330 lines of `scipy.optimize.minimize(L-BFGS-B)` driven
#   with both of its own stopping tests disabled over a hand-built trust region and a Lindh pairwise
#   model Hessian. BSD-3; measured, it adds exactly `networkx` to this closure, since numpy
#   and scipy are already here. Its distribution version is in `OptSpec.calc_version()` — **not** in
#   `engine_version()`, which this comment claimed for a wave while `'geometric' in
#   engine_version()` measured `False` — because it decides which stationary point is reached and
#   it runs on exactly one task. It is also **the one dependency here that publishes no wheel**, so
#   the image builds it, which is why `Containerfile` pins a build backend out of the lock's
#   `build` dependency group.
# - `numpy` is declared rather than inherited: three engine modules index and reshape arrays
#   directly, and >=2.0 is what tblite's and scipy's wheels resolve to here.
#
# **`xtb` and `crest` are not here and cannot be.** They are compiled Fortran programs distributed
# through conda-forge and distribution packages, not PyPI, so a Python dependency cannot express
# them; the image therefore ships without them and `xtb_cli.is_available()` is False. See
# `README.md` — this costs speed on large molecules and nothing else, because tblite carries the
# same Hamiltonians.
dependencies = [
    "mcp-server-kit",
    # Imported directly by this server's own engine metrics, not only through the kit.
    "prometheus-client>=0.20",
    "numpy>=2.0",
    "rdkit>=2024.3.1",
    "geometric>=1.1",
    "scipy>=1.11",
    "tblite>=0.7.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemclaw_mcp_calc"]

[tool.uv.sources]
mcp-server-kit = { workspace = true }
