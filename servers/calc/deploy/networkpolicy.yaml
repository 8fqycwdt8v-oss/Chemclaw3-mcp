# Default-deny egress for the `calc` server — the layer that makes "no outbound calls" true even if
# every line of Python in this repository were wrong.
#
# `policyTypes` names both directions, and `egress:` is an **empty list rather than an absent key**.
# That difference is the whole object: an absent `egress` key with `Egress` in `policyTypes` means
# "deny all", and so does an empty list, but only the empty list says so on purpose where a reader
# can see it. Removing `Egress` from `policyTypes` would silently restore unrestricted outbound
# traffic while the file still looked like a network policy.
#
# `tests/test_deploy.py` asserts this shape, in both directions, because a chart nobody verifies is
# a chart that drifts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chemclaw-mcp-calc
  labels:
    app.kubernetes.io/name: chemclaw-mcp-calc
    app.kubernetes.io/part-of: chemclaw3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chemclaw-mcp-calc
  policyTypes:
    - Ingress
    - Egress
  # Two callers, and no third. The agent's front door opens MCP sessions; Prometheus scrapes
  # `/metrics`. Neither needs anything else to reach this pod.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chemclaw
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8860
  # Deliberately empty. Every answer here is computed in-process from tblite, RDKit and scipy: there
  # is no database, no upstream API, and nothing to look up. Not even DNS is permitted, because a
  # server that never dials a host never needs to resolve one — and a DNS hole is the usual way a
  # "default-deny" egress policy quietly stops being one.
  #
  # It is worth one extra sentence here that the other servers do not need. This server's results
  # carry `calc_version` and `calc_key`, which exist so a *caller* can address a cache row. Nothing
  # here reaches that cache, and this policy is what keeps that structural rather than a promise: the
  # obvious "improvement" — have the server check the store before computing — is not reachable from
  # inside this pod.
  egress: []
