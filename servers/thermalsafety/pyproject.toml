[project]
name = "chemclaw-mcp-thermalsafety"
version = "0.1.0"
description = "MCP server: runaway and thermal-hazard arithmetic from calorimetry the chemist supplies."
requires-python = ">=3.11"
# The shortest closure in the fleet, and deliberately so. Every number here is closed-form
# arithmetic over the standard library's `math`: no corpus, no cheminformatics toolkit, no
# scientific stack. That is why `oxygen_balance_screen` takes a molecular formula rather than a
# SMILES — accepting one would mean either a silently wrong answer or RDKit in this image for the
# sake of a division. Adding a dependency here is a decision to be argued in the pull request.
dependencies = [
    "mcp-server-kit",
    # **The one dependency argued past the paragraph above**, and it is admissible for exactly one
    # reason: `molmass` is BSD-3 and has **zero** required dependencies — its optional `Flask` and
    # `pandas` extras are not installed. It replaces seventeen hand-transcribed atomic weights and a
    # formula regex in `engine/oxygen_balance.py` with a maintained table and grammar. `chemicals`
    # would answer the same question and was refused here: it drags numpy, scipy, pandas and fluids
    # into the shortest closure in this fleet, which is the closure this file exists to keep short.
    # What is *not* delegated is the domain — see `parse_formula`, which refuses the notations
    # molmass would happily guess at, in front of the library rather than behind it.
    "molmass>=2026.1.8",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemclaw_mcp_thermalsafety"]


[tool.uv.sources]
mcp-server-kit = { workspace = true }
