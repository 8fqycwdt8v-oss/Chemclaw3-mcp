# The Deployment for the `thermalsafety` server, and the file that carries its pod hardening.
#
# `deploy/` shipped a NetworkPolicy, a Service and a ServiceMonitor but **no workload**, so nothing
# in-cluster set `runAsNonRoot`, dropped Linux capabilities, applied a seccomp profile, or bounded
# CPU and memory — every one of those defaulted to the cluster's, which on a plain cluster is root,
# all capabilities, unconfined and unbounded. This is the workload, and every hardening field on it
# is asserted by `tests/test_deploy.py`.
#
# **The pod's label must equal the NetworkPolicy's `podSelector`.** The default-deny egress policy
# only governs pods it selects, so a one-character drift here silently exempts this workload from
# the very control the fleet's no-egress promise rests on — which is why the test checks the two
# against each other rather than each against a literal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chemclaw-mcp-thermalsafety
  labels:
    app.kubernetes.io/name: chemclaw-mcp-thermalsafety
    app.kubernetes.io/part-of: chemclaw3
spec:
  # **The HPA's `minReplicas` floor, and it is a floor rather than a count.** `replicas: 1` made
  # every capability in this fleet a single point of failure for all of its users: a rolling
  # update, a node drain, an eviction or one failed liveness probe took it to zero, and there was
  # no second pod to serve while the first came back. `hpa.yaml` owns the number above this floor;
  # this field is what a fresh install starts at and what a scale-to-zero would have to argue for.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chemclaw-mcp-thermalsafety
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chemclaw-mcp-thermalsafety
        app.kubernetes.io/part-of: chemclaw3
    spec:
      # No API access: this server never talks to the Kubernetes API, so it is handed no token to
      # steal. Set at the pod level so it covers the container regardless of the ServiceAccount.
      automountServiceAccountToken: false
      # Two replicas on one node are one replica with extra steps: the node is the failure domain a
      # drain, a kernel panic or a DiskPressure eviction acts on. `ScheduleAnyway` rather than
      # `DoNotSchedule` so a single-node dev or CI cluster still schedules the second pod instead of
      # leaving it Pending, which is the failure that gets a spread constraint deleted.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chemclaw-mcp-thermalsafety
      # **Derived from `connector.yaml`'s `request_timeout` (15 s) plus 30 s of drain**, not
      # written as a number: the manifest states the longest a caller waits for this server, so it
      # states the longest an in-flight call can still be worth finishing. Left at Kubernetes'
      # 30 s default, every rollout and every node drain SIGKILLed whatever was running — and for
      # a fleet that is stateless by design, that work is simply lost, because nothing here writes
      # a result anywhere until the call returns. `tests/test_deploy_shape.py` holds the
      # derivation, in both directions, for every server.
      terminationGracePeriodSeconds: 45
      # **No pinned `runAsUser`, `runAsGroup` or `fsGroup`.** OpenShift's default `restricted-v2`
      # SCC assigns a UID from the namespace's range and rejects any other, so a pinned 1001 left
      # the ReplicaSet with no pods at all. `runAsNonRoot` is what the hardening needs, and the
      # image's numeric `USER` is what lets the kubelet verify it on a plain cluster; the process
      # writes only to the `/tmp` `emptyDir` below, which is writable whatever UID it is handed.
      # `tests/test_deploy_shape.py` holds both halves for every server.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # **A placeholder, never a pull target.** This repository publishes nothing under this
          # name: raw manifests cannot know a site's registry, so the deploy step rewrites it to
          # the published digest (kustomize `images:` matches exactly this
          # `chemclaw3/chemclaw-mcp-<name>` string; `docs/operations.md` §2). Applied unrewritten,
          # a node resolves it against whatever registry it searches for short names, which is
          # not a build anybody here reviewed.
          # `tests/test_deploy_shape.py` holds the string to one shape across the fleet.
          image: chemclaw3/chemclaw-mcp-thermalsafety:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8851
          # **The name this pod is dialled by, so `/mcp` answers it.** Upstream's DNS-rebinding
          # guard admits a loopback `Host` only, and a caller dialling this Service sends its
          # `name:port`: measured on a kind cluster, every `/mcp` request was a 421 while `/healthz`
          # stayed green. The guard stays on, and this adds that one name to it. Held to
          # `service.yaml` by `tests/test_deploy_shape.py`; see `mcp_server_kit/rebinding.py`.
          env:
            - name: MCP_ALLOWED_HOSTS
              value: "chemclaw-mcp-thermalsafety:8851"
            # **The bearer `/mcp` verifies, under the name the manifest's `auth.token_env`
            # declares.** Without it the server fails closed and every call is a 401 while
            # `/healthz` stays green. `chemclaw-secrets` is the Secret Chemclaw3's chart reads,
            # keyed by variable name, so both halves hold one value; the fleet runs in the
            # release's namespace. Not `optional`: a missing key keeps the pod from starting
            # rather than letting it serve refusals. Held to the manifest by
            # `tests/test_deploy_shape.py`.
            - name: CHEMCLAW_THERMALSAFETY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chemclaw-secrets
                  key: CHEMCLAW_THERMALSAFETY_TOKEN
          # The container-level context is what a Pod Security "restricted" admitter reads. Every
          # field here is deny-by-default: no privilege escalation, every Linux capability dropped,
          # the runtime's seccomp profile, and a non-root UID.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # **This server is transport-bound, and the request is sized for the transport.**
          # Measured over a real MCP session on loopback: 6.5 ms for `adiabatic_temperature_rise`,
          # 7.8 ms for `tmr_ad`, 7.6 ms for `oxygen_balance_screen`. The arithmetic inside those is
          # 0.25 µs, 63.7 µs and 4.5 µs respectively — so under 1% of a call is this server's own
          # work and the rest is the streamable-HTTP round trip every server in the fleet pays.
          #
          # That is why the numbers below match `props` rather than being scaled down for a server
          # that does no real computation: scaling them to the arithmetic would size the pod for
          # the 1% and starve the 99%. `requests.cpu` is what `hpa.yaml` measures utilization
          # against, so it is the draw a pod doing real work actually has; 250m is ~32 calls a
          # second here.
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            # **`/healthz` here recomputes published values rather than loading a corpus**, which
            # is what a server with nothing to load still owes
            # (`D-2026-09-15-a-server-with-nothing-to-load-still-has-something-to-verify`). This
            # comment used to say the opposite — that the route is a constant 200 and `app.py`
            # passes no `readiness=` callable — which was this server's *first* argument and was
            # refused by the fleet invariant before it shipped. The callable has been there since;
            # the comment outlived the argument it was describing, which is the defect the record
            # above is named for, happening to that record's own server.
            #
            # What it verifies: `engine/selftest.py` puts known cases through the real public
            # functions and compares against values published independently of this code, because
            # the atomic-weight table and the screening bands are a vendored corpus that happens to
            # live in Python source, and a transposed digit in one is invisible.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # **`/livez`, not `/healthz`, and the two are different questions.** A liveness failure
            # kills the container; a readiness failure only takes the pod out of the Service and is
            # undone by the next passing probe. Both probes pointed here at `/healthz`, so every
            # dependency that route consults — a corpus checksum, an optional predictor's
            # checkpoint, a transformer that would not construct — was also a kill after
            # periodSeconds x failureThreshold. Measured on `rxnpredict`: one missing checkpoint
            # among eleven *optional* predictors answered 503, and a restart cannot recreate a
            # missing file, so a pod serving ten of eleven went to CrashLoopBackOff and served none.
            # `/livez` consults nothing: it answers only if the process is still serving HTTP, which
            # is the fault a restart fixes. See `mcp_server_kit.app.connector_app`.
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 35
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # A writable scratch mount so `tempfile` works with a read-only root filesystem; the
            # only path this process writes at runtime.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            # **A bound on the node's ephemeral storage, not on this pod's convenience.** An
            # unbounded `emptyDir` draws on the node's disk, so one pod filling it evicts its
            # *neighbours* — the one failure mode a fleet of small single-purpose pods cannot
            # absorb. Over this limit the kubelet evicts this pod alone, which is the blast radius
            # worth having. 64Mi here, and this server is the fleet's easiest case for it: there
            # is no corpus to stage and no subprocess to give a working directory, so `tempfile` is
            # the only writer and nothing routinely uses it at all.
            sizeLimit: 64Mi
