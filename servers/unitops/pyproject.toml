[project]
name = "chemclaw-mcp-unitops"
version = "0.1.0"
description = "MCP server: scale-up and unit-operation sizing correlations."
requires-python = ">=3.11"
# **`MODULES.md` proposed this server's offline source as "first-party correlations", and that is
# exactly what ships**: no corpus, no `data/` directory, no `dataset.json`, and a dependency closure
# that is the MCP transport and nothing else. Every number returned is closed-form algebra over
# `math` — a power law, two logarithms, a bisection on a bracket that cannot fail — which is the
# same closure `servers/kinetics` and `servers/thermalsafety` argued for and for the same reason: a
# server is a dependency closure as much as a capability.
#
# The one place a heavier stack would have bought something is a *compressible* cake filtration,
# which needs an `alpha = alpha₀·ΔPˢ` exponent fitted over filtration tests at several pressures. That is a
# regression over data nobody here has, and it is deliberately not built — see `README.md`.
dependencies = [
    "mcp-server-kit",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemclaw_mcp_unitops"]


[tool.uv.sources]
mcp-server-kit = { workspace = true }
