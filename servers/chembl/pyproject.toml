[project]
name = "chemclaw-mcp-chembl"
version = "0.1.0"
description = "MCP server: compound lookup and aggregated bioactivity summaries from a vendored ChEMBL subset (CC BY-SA 3.0)."
requires-python = ">=3.11"
# `rdkit` for the strict SMILES parse and the InChIKey a structure is matched on; `sqlite3` is the
# standard library's. The corpus is one read-only SQLite file in this package and no answer leaves
# the process.
dependencies = [
    "mcp-server-kit",
    "rdkit>=2024.3.1",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemclaw_mcp_chembl"]


[tool.uv.sources]
mcp-server-kit = { workspace = true }
