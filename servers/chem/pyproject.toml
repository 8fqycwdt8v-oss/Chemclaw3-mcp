[project]
name = "chemclaw-mcp-chem"
version = "0.1.0"
description = "MCP server: bench chemistry over RDKit — name resolution, charge tables, green metrics, depiction."
requires-python = ">=3.11"
# `rdkit` is the whole reason this is its own server rather than a family of tools bolted onto
# `props`: it is a large native dependency, and a server is a dependency closure as much as a
# capability. Nothing else is needed — the reagent table is a CSV in this package.
dependencies = [
    "mcp-server-kit",
    "rdkit>=2024.3.1",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemclaw_mcp_chem"]

[tool.hatch.build.targets.wheel.force-include]
"src/chemclaw_mcp_chem/data" = "chemclaw_mcp_chem/data"

[tool.uv.sources]
mcp-server-kit = { workspace = true }
