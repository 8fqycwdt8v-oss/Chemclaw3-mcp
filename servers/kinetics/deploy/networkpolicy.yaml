# Default-deny egress for the `kinetics` server — the layer that makes "no outbound calls"
# true even if every line of Python in this repository were wrong.
#
# `policyTypes` names both directions, and `egress:` is an **empty list rather than an absent key**.
# That difference is the whole object: an absent `egress` key with `Egress` in `policyTypes` means
# "deny all", and so does an empty list, but only the empty list says so on purpose where a reader
# can see it. Removing `Egress` from `policyTypes` would silently restore unrestricted outbound
# traffic while the file still looked like a network policy.
#
# `tests/test_deploy.py` asserts this shape, in both directions, because a chart nobody verifies is
# a chart that drifts — which is the failure Chemclaw3 recorded when its own deploy README described
# components the entrypoint had not known about for months.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chemclaw-mcp-kinetics
  labels:
    app.kubernetes.io/name: chemclaw-mcp-kinetics
    app.kubernetes.io/part-of: chemclaw3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chemclaw-mcp-kinetics
  policyTypes:
    - Ingress
    - Egress
  # Two callers, and no third. The agent's front door opens MCP sessions; Prometheus scrapes
  # `/metrics`. Neither needs anything else to reach this pod.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chemclaw
        # **Both names, because the documented target platform uses the second one.** Plain
        # Kubernetes with kube-prometheus-stack scrapes from `monitoring`; OpenShift's
        # user-workload Prometheus lives in `openshift-user-workload-monitoring`, which is the
        # namespace Chemclaw3's own chart names and which `docs/integration.md` heads its
        # deployment section with. Admitting only `monitoring` meant every ServiceMonitor in this
        # fleet resolved a target whose own ingress rule dropped the scrape — losing
        # `chemclaw_mcp_egress_refused_total`, `chemclaw_mcp_degraded_total` and the session-ceiling
        # gauges as silence, which is indistinguishable from a healthy server nobody is calling.
        # An `In` list rather than a second peer, so "whichever of the two this platform uses" is
        # one statement; `tests/test_deploy_shape.py` holds it fleet-wide.
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - monitoring
                  - openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8852
  # Deliberately empty. This server carries the weakest possible reason to need egress: it has no
  # corpus, no database, no backend and no upstream API — every number is closed-form arithmetic
  # over `math` and a seventeen-element dict in Python source. Not even DNS is permitted, because a
  # server that never dials a host never needs to look one up, and a DNS hole is the usual way a
  # "default-deny" egress policy quietly stops being one.
  egress: []
