# The Deployment for the `kinetics` server, and the file that carries its pod hardening.
#
# `deploy/` shipped a NetworkPolicy, a Service and a ServiceMonitor but **no workload**, so nothing
# in-cluster set `runAsNonRoot`, dropped Linux capabilities, applied a seccomp profile, or bounded
# CPU and memory — every one of those defaulted to the cluster's, which on a plain cluster is root,
# all capabilities, unconfined and unbounded. This is the workload, and every hardening field on it
# is asserted by `tests/test_deploy.py`.
#
# **The pod's label must equal the NetworkPolicy's `podSelector`.** The default-deny egress policy
# only governs pods it selects, so a one-character drift here silently exempts this workload from
# the very control the fleet's no-egress promise rests on — which is why the test checks the two
# against each other rather than each against a literal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chemclaw-mcp-kinetics
  labels:
    app.kubernetes.io/name: chemclaw-mcp-kinetics
    app.kubernetes.io/part-of: chemclaw3
spec:
  # **The HPA's `minReplicas` floor, and it is a floor rather than a count.** `replicas: 1` made
  # every capability in this fleet a single point of failure for all of its users: a rolling
  # update, a node drain, an eviction or one failed liveness probe took it to zero, and there was
  # no second pod to serve while the first came back. `hpa.yaml` owns the number above this floor;
  # this field is what a fresh install starts at and what a scale-to-zero would have to argue for.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chemclaw-mcp-kinetics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chemclaw-mcp-kinetics
        app.kubernetes.io/part-of: chemclaw3
    spec:
      # No API access: this server never talks to the Kubernetes API, so it is handed no token to
      # steal. Set at the pod level so it covers the container regardless of the ServiceAccount.
      automountServiceAccountToken: false
      # Two replicas on one node are one replica with extra steps: the node is the failure domain a
      # drain, a kernel panic or a DiskPressure eviction acts on. `ScheduleAnyway` rather than
      # `DoNotSchedule` so a single-node dev or CI cluster still schedules the second pod instead of
      # leaving it Pending, which is the failure that gets a spread constraint deleted.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chemclaw-mcp-kinetics
      # **Derived from `connector.yaml`'s `request_timeout` (15 s) plus 30 s of drain**, not
      # written as a number: the manifest states the longest a caller waits for this server, so it
      # states the longest an in-flight call can still be worth finishing. Left at Kubernetes'
      # 30 s default, every rollout and every node drain SIGKILLed whatever was running — and for
      # a fleet that is stateless by design, that work is simply lost, because nothing here writes
      # a result anywhere until the call returns. `tests/test_deploy_shape.py` holds the
      # derivation, in both directions, for every server.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # Replaced at deploy time with the registry path for this build; the tag is pinned by the
          # release pipeline, not left at a floating `latest` in production.
          image: chemclaw3/chemclaw-mcp-kinetics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8852
          # The container-level context is what a Pod Security "restricted" admitter reads. Every
          # field here is deny-by-default: no privilege escalation, every Linux capability dropped,
          # the runtime's seccomp profile, and a non-root UID.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # **Five tools are transport-bound and one is not, and the request is sized for the
          # five.** The closed-form tools are microseconds of arithmetic inside a call that is
          # milliseconds of streamable-HTTP round trip. `semibatch_accumulation_profile` derives
          # its step count from the caller's rate constant and dose time, and its worst legal call
          # is seconds of pure-Python CPU that holds the interpreter — so it is offloaded and gated
          # (`engine/admission.py`), and a pod serves those one at a time whatever `limits.cpu`
          # says. More of them per second is more replicas, which is what `hpa.yaml` is for.
          #
          # (This comment used to describe a chromatography server's "six single-peak tools" and a
          # `system_kinetics_report` this server has never had — copied, and wrong about the one
          # tool here that costs anything.)
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            # **`/healthz` here recomputes the constants against each other rather than loading a
            # corpus**, which is what a server with nothing to load still owes
            # (`D-2026-09-15-a-server-with-nothing-to-load-still-has-something-to-verify`).
            #
            # What it checks is chosen to be unsatisfiable by the code agreeing with itself: the
            # textbook CSTR/PFR ratio at 90% first-order conversion (3.909, written nowhere in
            # `reactors.py` and coming out of the two reactor models being *different*), the
            # closed-form batch inverse round-tripping exactly at five orders, the doubling-per-10-
            # degrees rule, the semi-batch integrator's convergence *order*, and the stable
            # scheme landing on the quasi-steady limit of a dose that reacts as it arrives.
            #
            # That last one has already earned its place. The first version of the integrator
            # guarded its feed term with `time < dose_time_seconds`, so the final RK4 step's k4
            # stage alone saw the feed switched off — one step of O(h) error in an O(h^4) scheme,
            # which dropped it to first-order convergence. The answer was still right to three
            # significant figures, so no absolute tolerance would have caught it; only the rate
            # did. See `engine/selftest.py`.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # **`/livez`, not `/healthz`, and the two are different questions.** A liveness failure
            # kills the container; a readiness failure only takes the pod out of the Service and is
            # undone by the next passing probe. Both probes pointed here at `/healthz`, so every
            # dependency that route consults — a corpus checksum, an optional predictor's
            # checkpoint, a transformer that would not construct — was also a kill after
            # periodSeconds x failureThreshold. Measured on `rxnpredict`: one missing checkpoint
            # among eleven *optional* predictors answered 503, and a restart cannot recreate a
            # missing file, so a pod serving ten of eleven went to CrashLoopBackOff and served none.
            # `/livez` consults nothing: it answers only if the process is still serving HTTP, which
            # is the fault a restart fixes. See `mcp_server_kit.app.connector_app`.
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 35
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # A writable scratch mount so `tempfile` works with a read-only root filesystem; the
            # only path this process writes at runtime.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            # **A bound on the node's ephemeral storage, not on this pod's convenience.** An
            # unbounded `emptyDir` draws on the node's disk, so one pod filling it evicts its
            # *neighbours* — the one failure mode a fleet of small single-purpose pods cannot
            # absorb. Over this limit the kubelet evicts this pod alone, which is the blast radius
            # worth having. 64Mi here, and this server is the fleet's easiest case for it: there
            # is no corpus to stage and no subprocess to give a working directory, so `tempfile` is
            # the only writer and nothing routinely uses it at all.
            sizeLimit: 64Mi
