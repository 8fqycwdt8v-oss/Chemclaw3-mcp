name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Re-running the gate against a ref otherwise costs an empty commit or a close-and-reopen, both
  # of which are things this repository's own review rules forbid — so without this there is no
  # legitimate way to re-run a gate at all. That is not hypothetical: a `pull_request` run failed
  # at startup (which GitHub refuses to retry) while the `push` run for the same commit wedged
  # before it reached the queue (neither cancellable nor re-runnable), leaving the pull request
  # with no route to a verdict while every other branch's CI drained normally. `Chemclaw3`'s own
  # ci.yml carries this trigger for the same reason.
  workflow_dispatch:
  # `deps` below scans the *lockfile* for known CVEs, so without this its coverage would be a
  # function of how often somebody happened to push: an advisory published against an unchanged
  # dependency stays invisible until the next commit. A blocking gate whose reach depends on commit
  # frequency is a gate on activity, not on the dependency closure. Weekly, so a quiet week still
  # gets one audit of what is actually deployed. The other three jobs ride along; they need no
  # cluster and no credentials, so a weekly re-run of them costs minutes and catches a toolchain
  # that moved underneath a green commit.
  schedule:
    - cron: "0 6 * * 1"

# Read-only by default, granted per job where more is needed — which is nothing here. Stated
# rather than inherited because every action in this file is SHA-pinned for the same reason: a
# third-party step that is not what it was when it was reviewed runs with whatever this token can
# do, and the ambient default is wider than any job below needs.
permissions:
  contents: read

# Nothing here needs a cluster, a database, or a network. That is a property of the fleet rather
# than of the workflow: every server answers from data in its own image, and `offline-check` proves
# it by taking the network away.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# **Pin the interpreter, because `python_version` in mypy's config does not pick one.**
# `pyproject.toml` declares `requires-python = ">=3.11"` and `[tool.mypy] python_version = "3.11"`,
# so with nothing set here uv resolved whatever the runner happened to ship — 3.12 — and installed
# numpy's 3.12-flavoured stubs, which mypy targeting 3.11 cannot parse:
# `numpy/__init__.pyi: Type statement is only supported in Python 3.12 and greater`. mypy reports
# that one error and stops ("errors prevented further checking"), so the job goes red without
# having looked at any first-party code.
#
# There was nothing to notice before `servers/calc`: no server here had needed numpy, so no
# third-party stub disagreed with the target. And it fails *only* in CI — a developer on 3.11 gets
# 3.11 stubs and a clean run — which is the "a green `make` locally means a green CI" promise
# breaking. So the fix belongs on the interpreter rather than on mypy's target: lowering the target
# would make the two agree by checking against a Python nobody runs.
env:
  UV_PYTHON: "3.11"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, because `actions/checkout`'s default is depth 1 and ancestry cannot be
      # decided on a shallow clone. `tests/test_decision_log.py::
      # test_every_commit_the_registers_cite_is_reachable_from_head` asks `git merge-base
      # --is-ancestor` whether a hash a record cites survives into `HEAD`, and on a shallow clone it
      # warns and returns rather than guessing — so under the default that assertion had **never run
      # in CI and could not**, while `main` sat red on it for anyone who cloned with full history.
      # This is the only check in the repository that needs history at all; full history costs
      # seconds on a tree this size, and the alternative is a ratchet that is a local courtesy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync the workspace
        run: uv sync --frozen

      # `make lint`, for the reason written under `Types` below and found a second time in the same
      # file: this step spelled the two ruff commands inline, which is a second declaration of what
      # the gate is. It had not drifted yet, and "had not drifted yet" is what the `Types` comment
      # says about its own predecessor.
      - name: Lint
        run: make lint

      # `make type` rather than a repeated path list: this step had already drifted — it named
      # three source trees while the Makefile named four, so `servers/safety/src` was type-checked
      # locally and not in CI. One list, in the Makefile, is what stops that recurring as servers
      # are added.
      # `if: !cancelled()` on this step and the next, because the job that used to report the
      # fleet invariants independently is gone (see the note below the `offline` job). Steps in one
      # job are sequential, so without this a ruff finding aborts `check` before mypy or the suite
      # runs, and a push with one formatting slip reports nothing about the other two gates — which
      # the deleted `manifests` job, on its own runner, did report. Every gate still blocks; what
      # changes is that a red one no longer hides the others.
      - name: Types
        if: ${{ !cancelled() }}
        run: make type

      # `make cov` rather than a bare `pytest`: same suite, plus the coverage floor
      # `pyproject.toml` declares. Measured at 176 s against 210 s for the bare run, so the floor
      # costs nothing and running the suite twice to get it would cost everything.
      - name: Tests and the coverage floor
        if: ${{ !cancelled() }}
        run: make cov

  offline:
    # The strongest form of the no-egress claim, and the one that does not trust our own code: run
    # the whole suite in a network namespace with no route off the host. A server quietly reaching
    # an upstream fails here and nowhere else.
    runs-on: ubuntu-latest
    steps:
      # Full history, for the reason given on `check`'s checkout: this job runs the same suite
      # under `scripts/offline_check.py`, so it carries the same assertion.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync the workspace
        run: uv sync --frozen

      # This job had never passed — red on every run including `main`, with `check` green
      # throughout (and the `manifests` job that then existed), so the strongest no-egress claim
      # in the repository was the one that had never actually run.
      #
      # **`unshare --net` alone needs `CAP_SYS_ADMIN`,** which the runner user does not have; it
      # only ever worked where someone ran it as root. Creating a *user* namespace first grants
      # `CAP_SYS_ADMIN` inside it, which is what makes the network namespace reachable
      # unprivileged — and `--map-root-user` is also what gives the script the `CAP_NET_ADMIN` its
      # loopback ioctl needs. Both flags are load-bearing; neither is belt-and-braces.
      #
      # The sysctl is the *second* gate: `ubuntu-latest` is 24.04, which puts unprivileged user
      # namespaces behind AppArmor. Best-effort, so an image without the knob — or a future one
      # that drops the restriction — falls through to the check rather than failing on its
      # workaround.
      #
      # `sudo unshare` would also work and is deliberately not used: a no-egress proof that needs
      # root is a weaker claim than one that does not.
      #
      # Verified as a non-root user before committing, rather than reasoned about: plain
      # `unshare --net` reproduces CI's "Operation not permitted" exactly, the form below succeeds,
      # loopback comes up, and an outbound request raises `URLError` inside it.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run the suite with no network
        run: unshare --user --map-root-user --net -- uv run python scripts/offline_check.py -q

  # **There was a `manifests` job here and it has been deleted, which is a reduction in jobs and not
  # in coverage.** It ran `uv run pytest -q tests` on its own runner, and `pyproject.toml` sets
  # `testpaths = ["tests", "packages", "servers"]` — so every test it ran was already in the set the
  # `check` job runs, on the same image, after the same `uv sync`. A job that cannot go red unless
  # another job also goes red is a second light on one fault, which is the shape this repository
  # deleted a port table over; it bought a runner's worth of minutes per push and a second place to
  # read the same failure. The fleet-level invariants it named are not lost — they are `tests/`, and
  # `check` runs them.
  #
  # **This paragraph used to state both counts and both were wrong**, which is the rule one document
  # over (`CLAUDE.md`: "a number in prose is a claim about its author's afternoon") being broken by
  # the argument for a deletion. "182" was the `tests/` count at the *parent* commit and 207 at the
  # one that wrote it; "2,034" matched neither commit. `pytest -q tests --collect-only` answers, and
  # the subset relation is what the argument rests on — that is a property of `testpaths`, not of
  # any number.
  #
  # **And one behaviour was lost that the paragraph did not mention.** `check`'s steps are
  # sequential, so a ruff failure aborted the job before mypy or the suite ran, where the separate
  # runner had reported the fleet invariants anyway. `if: !cancelled()` on the `Types` and `Tests`
  # steps is what restores that, inside one job.

  deps:
    # The supply-chain gate: `pip-audit` over the locked closure, blocking. It is a separate job
    # rather than a step in `check` because it is the one gate whose fix lives in `uv.lock` rather
    # than in the diff under review, and because it is the only job in this file that *needs* the
    # network — the other three prove the opposite property about this fleet.
    runs-on: ubuntu-latest
    steps:
      # No `fetch-depth:` here, deliberately: this job runs `make deps-audit` and no test, so it
      # is the one checkout in this file with nothing to decide about ancestry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # No `uv sync`: the target audits the exported lockfile, not the environment, so nothing has
      # to be installed for it to be right.
      - name: Audit the locked dependency closure for known vulnerabilities
        run: make deps-audit
