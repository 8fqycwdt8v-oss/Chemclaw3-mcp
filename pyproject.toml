[project]
name = "chemclaw3-mcp"
version = "0.1.0"
description = "MCP tool servers for the Chemclaw3 process-R&D agent. One capability, one server, one process."
requires-python = ">=3.11"
# The workspace root installs nothing of its own: every runtime dependency belongs to the server
# that needs it, so a server's image carries its dependency closure and nobody else's.
dependencies = []

[dependency-groups]
dev = [
    # `[testing]` because every server's `test_server.py` imports `mcp_server_kit.testing`,
    # whose `httpx`/`pyyaml` are declared there rather than assumed from this list. `[otel]` for the
    # same reason one step further: `tracing.py` is only exercisable where the API is installed, and
    # a shipped image installs neither extra.
    "mcp-server-kit[testing,otel]",
    "chemclaw-mcp-props",
    "chemclaw-mcp-rxnpredict",
    "chemclaw-mcp-rxnlabel",
    "chemclaw-mcp-chem",
    "chemclaw-mcp-safety",
    "chemclaw-mcp-calc",
    "chemclaw-mcp-pyexec",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    # `servers/calc` drives scipy directly — L-BFGS-B over tblite's analytic gradient, and the
    # null-space projection that separates a molecule's vibrations from its rotations. Without the
    # stubs both imports are `import-untyped` under `--strict`, which would mean either an ignore
    # per import or a blanket override that also hides real errors.
    "scipy-stubs>=1.17.1",
    # The SDK, for the tracing test alone. It is what turns the API's non-recording proxy spans into
    # recordable ones, so `tests/test_tracing.py` can assert that a tool call actually joined the
    # caller's trace instead of asserting that nothing raised. Deliberately paired with an
    # *in-memory* exporter there and with none here: nothing in this workspace may dial a collector.
    "opentelemetry-sdk>=1.25",
    "pytest-cov>=5.0",
]

[tool.uv.workspace]
members = ["packages/*", "servers/*"]

[tool.uv.sources]
mcp-server-kit = { workspace = true }
chemclaw-mcp-props = { workspace = true }
chemclaw-mcp-rxnpredict = { workspace = true }
chemclaw-mcp-rxnlabel = { workspace = true }
chemclaw-mcp-chem = { workspace = true }
chemclaw-mcp-safety = { workspace = true }
chemclaw-mcp-calc = { workspace = true }
chemclaw-mcp-pyexec = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# `S` is flake8-bandit, `ASYNC` is flake8-async, `BLE` is flake8-blind-except. The three were added
# together in one measured pass (`D-2026-09-13-the-rule-that-would-have-caught-it-was-not-the-one-asked-for`)
# and each earns its place differently:
#
# - **`BLE` is the one that pays, and it is half of the control rather than the whole of it.**
#   Every `except Exception` in this fleet that answers anyway is supposed to classify through
#   `mcp_server_kit.degradation`. Nothing checked it, and `rxnpredict`'s cache did not. `BLE001`
#   lands on most of those lines, so a new blind handler is red until somebody writes the reason at
#   the site — which is where a reader of the handler will look, rather than in a document beside
#   it. **What it does not land on** is a handler that logs with `logging.exception` and returns, or
#   one that re-raises conditionally, and `RUF100` (selected below) rejects a `# noqa: BLE001` on
#   those lines as unused, so the reason cannot even be written there. That half is
#   `tests/test_fleet.py::test_every_blind_handler_that_answers_anyway_is_argued`
#   (`D-2026-09-14-a-lint-rule-that-does-not-fire-is-not-the-control-it-was-read-as`).
# - **`S`** catches a credential or an `exec` reaching source. Most of what it finds here is a
#   naming collision with this fleet's own vocabulary (`token_env` holds an environment variable's
#   *name*), so the exemptions are per-site `noqa`s with the reason rather than a blanket ignore:
#   the next literal that is a real secret has to be argued too.
# - **`ASYNC`** finds a blocking call on an event loop. The five here are in test drivers talking
#   to a uvicorn running in its own thread, which is why they are harmless and why saying so is
#   worth one line each.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "ASYNC", "BLE"]
# `S101` (`assert`) is off fleet-wide and the reason is that something stricter already holds it.
# `tests/test_fleet.py::test_no_serving_module_enforces_an_invariant_with_assert` scans every
# `packages/*/src` and `servers/*/src` and carries the argument for its two exemptions —
# `mcp_server_kit`'s `testing.py` and `no_egress.py`, whose *product* is an assertion failure.
# Turning `S101` on would mean transcribing that exemption list into a `per-file-ignores` block,
# which is a second declaration of one rule with nothing reconciling the two: the defect this
# repository deleted a port table over. The lint rule is also the weaker of the pair — it cannot
# tell a serving module from a test helper that lives under `src/`.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# A test's fixtures are the subject, not a leak. `S105`/`S106` fire on every `TOKEN = "dev-token"`
# a bearer-auth test needs in order to be a bearer-auth test; `S104` fires on the `0.0.0.0` literals
# `test_egress.py` asserts the guard *refuses*; `S603`/`S607` fire on the `git` and `python`
# subprocesses the fleet-level tests drive. None of the five says anything about a shipped image.
"**/tests/**" = ["S104", "S105", "S106", "S603", "S607"]
# Operational scripts, run by a person outside any serving image (`scripts/README.md`). The whole
# point of `offline_check.py` is to start a subprocess in a stripped network namespace.
"scripts/*.py" = ["S603", "S606", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
# Every package ships its own `src/` layout; point mypy at the sources rather than the installed
# copies so a type error is reported against the file a person edits.
mypy_path = "packages/mcp_server_kit/src:servers/props/src:servers/rxnpredict/src:servers/rxnlabel/src:servers/chem/src:servers/safety/src:servers/calc/src:servers/pyexec/src"

[[tool.mypy.overrides]]
module = [
    "mcp.*",
    # The GFN semiempirical Hamiltonian, in-process (`servers/calc`). It ships a compiled extension
    # with no `py.typed`, so `Calculator` and its result object are untyped at the boundary
    # `engine/xtb_engine.py` deliberately keeps to one module.
    "tblite.*",
    # Predictor dependencies, each behind its own extra and none installed here.
    "dgl.*",
    "onmt.*",
    "rxn_insight.*",
    "rxnmapper.*",
    "t5chem.*",
    "torch.*",
    "two_stage_dnn.*",
    "transformers.*",
]
ignore_missing_imports = true

# The advisories `make deps-audit` does not fail on, as data rather than as prose.
#
# **The argument for each is in the `Makefile`, beside the target that reads this.** What lives here
# is the pair that makes an argument checkable: the package the argument is about, and the version
# `uv.lock` resolved when it was written. `pip-audit`'s `--ignore-vuln` matches an advisory by its id **or
# any of its aliases** — measured 2026-09-14: dropping the `GHSA-xrqw-3rrv-vx5w` row makes
# `PYSEC-2026-3929` reappear. **What that does *not* explain is the eight-rows-to-`13 ignored` gap,
# which this comment used to attribute to it.** The audit returns 13 findings over eight distinct
# ids because five of the eight are returned *twice* by the advisory service; aliasing accounts for
# exactly two of the thirteen, one for each of the two rows whose id this closure does not report
# under. The arithmetic is in the `Makefile` beside the argument. What id-or-alias matching cannot
# notice is a dependency being *fixed*: the finding merely
# stops being reported and the suppression outlives its reason in silence — which
# the Makefile said in as many words ("Nothing here goes red when a fix ships") and nothing
# answered. `tests/test_deps_suppressions.py` is the answer: when the lock moves one of these
# packages, the entry goes red and somebody re-derives it against the version that will actually
# ship. An entry whose package the lock no longer resolves at all goes red too, because a
# suppression for a dependency this fleet has dropped is a line nobody will ever delete otherwise.
#
# This is the only declaration of the ids. The Makefile builds its `--ignore-vuln` flags from it, so
# the list cannot be in two places and disagree.
[tool.chemclaw.deps-audit]
suppressions = [
    { id = "PYSEC-2026-2447", package = "diskcache", version = "5.6.3" },
    { id = "PYSEC-2026-3447", package = "setuptools", version = "80.10.2" },
    { id = "PYSEC-2025-217", package = "transformers", version = "4.57.6" },
    { id = "PYSEC-2026-2288", package = "transformers", version = "4.57.6" },
    { id = "PYSEC-2026-2289", package = "transformers", version = "4.57.6" },
    { id = "PYSEC-2026-2290", package = "transformers", version = "4.57.6" },
    # `aliases` is the same advisory under another database's id. It is here only so that
    # `test_the_makefile_argues_exactly_the_suppressions_that_are_declared` can tell a second
    # name for one advisory from a ninth suppression nobody declared; `--ignore-vuln` is
    # built from `id` alone.
    { id = "GHSA-xrqw-3rrv-vx5w", package = "transformers", version = "4.57.6", aliases = ["CVE-2026-9856", "PYSEC-2026-3929"] },
    { id = "CVE-2026-69112", package = "accelerate", version = "1.14.0", aliases = ["PYSEC-2026-3804"] },
]

[tool.coverage.run]
# The eight distributions this workspace ships. Named rather than discovered, because a `--cov=src`
# over a `src/` layout measures whatever happens to be imported and quietly drops a package nobody
# imported at all — which is the one case a floor exists to catch.
source_pkgs = [
    "mcp_server_kit",
    "chemclaw_mcp_props",
    "chemclaw_mcp_chem",
    "chemclaw_mcp_safety",
    "chemclaw_mcp_calc",
    "chemclaw_mcp_pyexec",
    "chemclaw_mcp_rxnlabel",
    "chemclaw_mcp_rxnpredict",
]

[tool.coverage.report]
# **88, and it is a measurement rather than a round number.** Measured on the whole suite at the
# commit that added this: 7,220 statements, 811 uncovered, **88.77%**. 88 is the largest integer
# below that, so the floor is roughly 0.8 points of headroom - one commit's churn, not a licence to
# drop - and raising it is what a wave that improves coverage should do.
#
# **What it does not cover, stated because a floor reads as a guarantee.** Three things are outside
# it and none is an oversight:
#
# - **The eleven optional predictor adapters in `rxnpredict` measure 40-57%**, because their extras
#   are not installed in this workspace and each module's body stops at its import guard. Two of
#   them (`reaction_t5`, `rxn_insight`) are what the *shipped image* installs, so the code with the
#   least coverage here is code that runs in production. `servers/rxnpredict/README.md` says which.
# - **`pyexec`'s `engine/runner.py` measures 22%** for a structural reason: it runs in a *subprocess*
#   inside the jail, which this process cannot trace. Its behaviour is covered - by
#   `servers/pyexec/tests/test_sandbox.py` driving the real jail - and none of that lands here.
# - **This measures the source tree, never an image.** What an image installs is
#   `tests/test_fleet.py::test_every_image_installs_the_closure_the_audit_read`'s subject, and what
#   it *answers* is the Jenkins verify stage's.
fail_under = 88
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Every server ships tests/test_server.py, test_no_egress.py and test_deploy.py — that sameness is
# the point. The default `prepend` import mode keys test modules by basename and so refuses the
# second server; `importlib` keys by path.
addopts = "--import-mode=importlib"
testpaths = ["tests", "packages", "servers"]
