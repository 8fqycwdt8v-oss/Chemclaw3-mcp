[project]
name = "mcp-server-kit"
version = "0.1.0"
description = "The shape every Chemclaw3 MCP server has: FastAPI transport, bearer auth, identity logging, vendored datasets, and the egress guard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "mcp>=1.9,<2",
    "prometheus-client>=0.20",
    "pydantic>=2.9",
    "starlette>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_kit"]
