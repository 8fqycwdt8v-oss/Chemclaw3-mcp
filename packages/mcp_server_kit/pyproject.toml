[project]
name = "mcp-server-kit"
version = "0.1.0"
description = "The shape every Chemclaw3 MCP server has: FastAPI transport, bearer auth, identity logging, W3C trace continuation, vendored datasets, and the egress guard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "mcp>=1.9,<2",
    "prometheus-client>=0.20",
    "pydantic>=2.9",
    "starlette>=0.38",
]

# `testing.py` only. `assert_manifest_matches` drives a *running* server over ASGI and parses a
# `connector.yaml`, so it needs an HTTP client and a YAML parser — which were declared by nobody,
# and resolved only because both are root dev dependencies of this workspace. That made
# `uv run --package chemclaw-mcp-props pytest` impossible, since every server's `test_server.py`
# imports this module. An extra rather than a runtime dependency because a serving image never
# imports it; not because it keeps an HTTP client out of the image, which nothing can — the MCP SDK
# imports one (`packages/mcp_server_kit/tests/test_no_egress.py` measures both halves).
[project.optional-dependencies]
testing = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]
# `tracing.py` only, and an extra rather than a runtime dependency on purpose. Every server here
# would otherwise carry it, and the reason `props` starts in under a second is that it carries
# nothing it does not need — `tracing.py` imports it lazily and skips the span when it is absent, so
# a server that never traces pays an environment read.
#
# The **API** alone: this kit constructs no provider, no processor and no exporter, because the
# egress guard is armed on import in every one of these processes. A deployment that wants spans
# exported installs the SDK and an exporter itself and opens a destination in its NetworkPolicy.
otel = [
    "opentelemetry-api>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_kit"]
